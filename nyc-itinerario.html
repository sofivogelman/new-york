<title>NYC Trip · Jun 9–16</title>

<style>
  :root {
    --bg: #0e0e0e; --card: #161616; --border: #2a2a2a;
    --accent: #e8c87a; --accent2: #7ab8e8;
    --text: #f0ede8; --muted: #888; --red: #e87a7a; --green: #7ae8a0;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; font-weight:300; min-height:100vh; }

  header { padding:48px 24px 32px; text-align:center; border-bottom:1px solid var(--border); position:relative; overflow:hidden; }
  header::before { content:''; position:absolute; top:-60px; left:50%; transform:translateX(-50%); width:400px; height:400px; background:radial-gradient(ellipse,rgba(232,200,122,0.08) 0%,transparent 70%); pointer-events:none; }
  .tag { display:inline-block; font-size:11px; font-weight:500; letter-spacing:0.15em; text-transform:uppercase; color:var(--accent); border:1px solid rgba(232,200,122,0.3); padding:4px 12px; border-radius:20px; margin-bottom:16px; }
  h1 { font-family:'Playfair Display',serif; font-size:clamp(2.4rem,7vw,4rem); font-weight:700; line-height:1.05; letter-spacing:-0.02em; margin-bottom:8px; }
  h1 em { font-style:italic; color:var(--accent); }
  .subtitle { color:var(--muted); font-size:14px; letter-spacing:0.05em; }

  nav { display:flex; gap:6px; padding:16px; overflow-x:auto; scrollbar-width:none; border-bottom:1px solid var(--border); }
  nav::-webkit-scrollbar { display:none; }
  .day-btn { flex-shrink:0; padding:8px 16px; border-radius:20px; border:1px solid var(--border); background:transparent; color:var(--muted); font-family:'DM Sans',sans-serif; font-size:13px; cursor:pointer; transition:all 0.2s; white-space:nowrap; }
  .day-btn:hover { border-color:var(--accent); color:var(--text); }
  .day-btn.active { background:var(--accent); color:#0e0e0e; border-color:var(--accent); font-weight:500; }
  .day-btn.boston.active { background:var(--accent2); border-color:var(--accent2); }
  .day-btn.boston { border-color:rgba(122,184,232,0.4); }

  main { max-width:720px; margin:0 auto; padding:24px 16px 80px; }
  .day-panel { display:none; }
  .day-panel.active { display:block; }

  .day-header { margin-bottom:24px; padding-bottom:16px; border-bottom:1px solid var(--border); }
  .day-header .num { font-size:11px; font-weight:500; letter-spacing:0.12em; text-transform:uppercase; color:var(--accent); margin-bottom:6px; }
  .day-header .num.bnum { color:var(--accent2); }
  .day-header h2 { font-family:'Playfair Display',serif; font-size:1.7rem; font-weight:700; line-height:1.2; }
  .day-header p { color:var(--muted); font-size:13px; margin-top:6px; line-height:1.5; }

  /* Map section */
  .map-section { margin:20px 0; border-radius:12px; overflow:hidden; border:1px solid var(--border); background:rgba(255,255,255,0.02); }
  .map-label { font-size:11px; font-weight:500; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); padding:10px 14px; background:rgba(255,255,255,0.03); border-bottom:1px solid var(--border); }
  .map-body { padding:14px 14px 12px; }
  .map-stops { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-bottom:12px; }
  .map-stop { display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--text); background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:20px; padding:4px 10px; }
  .map-num { width:16px; height:16px; border-radius:50%; background:var(--accent); color:#0e0e0e; font-size:9px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .map-num.b { background:var(--accent2); }
  .map-arrow { color:var(--border); font-size:14px; line-height:1; }
  .map-open { display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:20px; border:1px solid rgba(232,200,122,0.3); background:transparent; color:var(--accent); font-family:'DM Sans',sans-serif; font-size:12px; font-weight:500; cursor:pointer; text-decoration:none; transition:all 0.2s; }
  .map-open:hover { background:rgba(232,200,122,0.08); }
  .map-open.b { border-color:rgba(122,184,232,0.3); color:var(--accent2); }
  .map-open.b:hover { background:rgba(122,184,232,0.08); }

  .activity { display:flex; gap:16px; padding:16px 0; border-bottom:1px solid var(--border); animation:fadeIn 0.3s ease; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
  .time-col { flex-shrink:0; width:52px; text-align:right; }
  .time-col span { font-size:11px; color:var(--muted); font-weight:500; letter-spacing:0.04em; }
  .dot-line { display:flex; flex-direction:column; align-items:center; gap:2px; flex-shrink:0; width:20px; padding-top:3px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--accent); flex-shrink:0; }
  .dot.bd { background:var(--accent2); }
  .dot.fd { background:var(--green); }
  .dot.nd { background:var(--red); }
  .line { width:1px; flex:1; min-height:20px; background:var(--border); }
  .content { flex:1; padding-bottom:8px; }
  .content h3 { font-size:15px; font-weight:500; margin-bottom:4px; }
  .content > p { font-size:13px; color:var(--muted); line-height:1.55; }

  .badge { display:inline-block; font-size:10px; font-weight:500; letter-spacing:0.08em; text-transform:uppercase; padding:2px 8px; border-radius:10px; margin-bottom:6px; }
  .badge.gratis { background:rgba(122,232,160,0.12); color:var(--green); border:1px solid rgba(122,232,160,0.2); }
  .badge.pago { background:rgba(232,200,122,0.10); color:var(--accent); border:1px solid rgba(232,200,122,0.2); }
  .badge.comida { background:rgba(232,122,122,0.10); color:var(--red); border:1px solid rgba(232,122,122,0.2); }
  .badge.noche { background:rgba(122,122,232,0.10); color:#a0a0e8; border:1px solid rgba(122,122,232,0.2); }

  .resto-list { margin-top:10px; display:flex; flex-direction:column; gap:8px; }
  .resto-item { background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
  .resto-name { font-size:13px; font-weight:500; color:var(--text); margin-bottom:2px; }
  .resto-stars { font-size:11px; color:var(--accent); margin-left:6px; }
  .resto-desc { font-size:12px; color:var(--muted); line-height:1.4; }

  .tip-box { background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-top:24px; }
  .tip-box .tip-title { font-size:11px; font-weight:500; letter-spacing:0.1em; text-transform:uppercase; color:var(--accent); margin-bottom:8px; }
  .tip-box p { font-size:13px; color:var(--muted); line-height:1.6; }

  footer { max-width:720px; margin:0 auto; padding:0 16px 40px; }
  .legend { display:flex; gap:16px; flex-wrap:wrap; padding-top:24px; border-top:1px solid var(--border); }
  .legend-item { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); }
  .ldot { width:8px; height:8px; border-radius:50%; }
</style>
</head>
<body>

<header>
  <div class="tag">Jun 9 – 16 · 2025</div>

function buildNav() {
  const nav = document.getElementById('nav');
  days.forEach((d, i) => {
    const btn = document.createElement('button');
    btn.className = 'day-btn' + (d.boston ? ' boston' : '') + (i === 0 ? ' active' : '');
    btn.textContent = d.label + (d.boston ? ' 🇺🇸' : '');
    btn.onclick = () => showDay(i);
    nav.appendChild(btn);
  });
}

function showDay(idx) {
  document.querySelectorAll('.day-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
  document.querySelectorAll('.day-panel').forEach((p, i) => p.classList.toggle('active', i === idx));
}

function dc(d) {
  if (d==='fd') return 'dot fd';
  if (d==='nd') return 'dot nd';
  if (d==='bd') return 'dot bd';
  return 'dot';
}

function buildMap(d) {
  const isBoston = d.boston;
  const numClass = isBoston ? 'map-num b' : 'map-num';
  const btnClass = isBoston ? 'map-open b' : 'map-open';
  let stopsHtml = '';
  d.mapStops.forEach((s, i) => {
    if (i > 0) stopsHtml += '<span class="map-arrow">›</span>';
    stopsHtml += `<span class="map-stop"><span class="${numClass}">${i+1}</span>${s}</span>`;
  });
  return `
    <div class="map-section">
      <div class="map-label">🗺 Recorrido del día</div>
      <div class="map-body">
        <div class="map-stops">${stopsHtml}</div>
        <a class="${btnClass}" href="${d.mapUrl}" target="_blank">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
          Abrir en Google Maps
        </a>
      </div>
    </div>`;
}

function buildRestos(restos) {
  if (!restos || !restos.length) return '';
  return '<div class="resto-list">' + restos.map(r =>
    `<div class="resto-item">
      <div class="resto-name">${r.name}<span class="resto-stars">${r.stars}</span></div>
      <div class="resto-desc">${r.desc}</div>
    </div>`
  ).join('') + '</div>';
}

function buildPanels() {
  const main = document.getElementById('main');
  days.forEach((d, i) => {
    const panel = document.createElement('div');
    panel.className = 'day-panel' + (i === 0 ? ' active' : '');
    const numClass = d.boston ? 'num bnum' : 'num';
    let html = `
      <div class="day-header">
        <div class="${numClass}">${d.date}</div>
        <h2>${d.title}</h2>
        <p>${d.desc}</p>
      </div>
      ${buildMap(d)}
    `;
    d.items.forEach((item, idx) => {
      const isLast = idx === d.items.length - 1;
      html += `
        <div class="activity">
          <div class="time-col"><span>${item.time}</span></div>
          <div class="dot-line">
            <div class="${dc(item.dot)}"></div>
            ${!isLast ? '<div class="line"></div>' : ''}
          </div>
          <div class="content">
            <span class="badge ${item.badge}">${item.badge}</span>
            <h3>${item.title}</h3>
            <p>${item.text}</p>
            ${buildRestos(item.restos)}
          </div>
        </div>`;
    });
    if (d.tip) html += `<div class="tip-box"><div class="tip-title">💡 Tip del día</div><p>${d.tip}</p></div>`;
    panel.innerHTML = html;
    main.appendChild(panel);
  });
}

buildNav();
buildPanels();
</script>
</body>
</html>
